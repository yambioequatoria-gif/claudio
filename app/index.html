<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lite PDF</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <rect class="tile" width="64" height="64" rx="15"/>
      <path class="sheet" d="M19 13h19l11 11v25a3 3 0 0 1-3 3H19a3 3 0 0 1-3-3V16a3 3 0 0 1 3-3z"/>
      <path class="fold" d="M38 13v8a3 3 0 0 0 3 3h8z"/>
      <rect class="mark-bar" x="21" y="29.5" width="24" height="8" rx="2"/>
      <rect class="line" x="22" y="32" width="19" height="3" rx="1.5"/>
      <rect class="line" x="22" y="42" width="12" height="3" rx="1.5"/>
    </svg>
    <span id="docName" class="doc-name">No file open</span>
    <span id="dirtyDot" class="dirty-dot" title="Unsaved changes" hidden></span>
  </div>

  <div class="tools">
    <button id="openBtn" class="btn primary" title="Open a PDF (Ctrl+O)">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg>
      Open
    </button>
    <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
    <div class="group" role="group" aria-label="File">
      <button id="saveBtn" class="icon-btn" title="Save (Ctrl+S)" aria-label="Save" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v15H5zM8 3v5h7V3M8 21v-7h8v7"/></svg>
      </button>
      <button id="saveAsBtn" class="icon-btn" title="Save a copy (Ctrl+Shift+S)" aria-label="Save a copy" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
      </button>
      <button id="printBtn" class="icon-btn" title="Print (Ctrl+P)" aria-label="Print" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v7H7z"/></svg>
      </button>
    </div>

    <span class="sep" aria-hidden="true"></span>

    <div class="group" role="group" aria-label="Pages">
      <button id="prevBtn" class="icon-btn" title="Previous page" aria-label="Previous page" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <label class="page-box">
        <input id="pageInput" type="number" min="1" value="1" aria-label="Page number" disabled>
        <span id="pageCount">of 0</span>
      </label>
      <button id="nextBtn" class="icon-btn" title="Next page" aria-label="Next page" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <span class="sep" aria-hidden="true"></span>

    <div class="group" role="group" aria-label="Zoom">
      <button id="zoomOutBtn" class="icon-btn" title="Zoom out" aria-label="Zoom out" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
      </button>
      <span id="zoomLabel" class="zoom-label">100%</span>
      <button id="zoomInBtn" class="icon-btn" title="Zoom in" aria-label="Zoom in" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="fitWidthBtn" class="btn" title="Fit page to width" aria-label="Fit page to width" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg>
        <span class="btn-label">Fit width</span>
      </button>
    </div>

    <span class="sep" aria-hidden="true"></span>

    <div class="group find" role="search">
      <svg class="icon muted" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="findInput" type="search" placeholder="Find in PDF" aria-label="Find in document" disabled>
      <span id="findCount" class="find-count"></span>
      <button id="findPrevBtn" class="icon-btn" title="Previous match (Shift+Enter)" aria-label="Previous match" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 15l-6-6-6 6"/></svg>
      </button>
      <button id="findNextBtn" class="icon-btn" title="Next match (Enter)" aria-label="Next match" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>

    <span class="sep" aria-hidden="true"></span>

    <button id="commentsBtn" class="btn toggle" aria-pressed="false" title="Show or hide comments" disabled>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="btn-label">Comments</span>
      <span id="commentCount" class="badge">0</span>
    </button>
  </div>
</header>

<div class="workspace">
  <nav id="rail" class="rail" aria-label="Tools">
    <button id="pagesBtn" class="tool plain" aria-pressed="false" title="Pages" aria-label="Pages" disabled>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
    </button>
    <span class="rail-sep"></span>
    <button class="tool" data-tool="select" aria-pressed="true" title="Select and edit (V)" disabled>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 7-6 2-2 6z"/></svg>
    </button>
    <span class="rail-sep"></span>
    <button class="tool" data-tool="highlight" aria-pressed="false" title="Highlight text (H)" disabled>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h7M14 4l6 6-8 8-5-1-1-5z"/></svg>
    </button>
    <button class="tool" data-tool="underline" aria-pressed="false" title="Underline text (U)" disabled>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v7a5 5 0 0 0 10 0V4M5 20h14"/></svg>
    </button>
    <button class="tool" data-tool="strikeout" aria-pressed="false" title="Strike through text (S)" disabled>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M16.5 7C15.5 5 9 5 8 8s3 3.5 4 4M8 17c1 2.5 7.500 2.500 8-1"/></svg>
    </button>
    <span class="rail-sep"></span>
    <button class="tool" data-tool="note" aria-pressed="false" title="Add a comment (N)" disabled>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2zM8 9h8M8 13h5"/></svg>
    </button>
    <button class="tool" data-tool="text" aria-pressed="false" title="Add text (T)" disabled>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>
    </button>
    <button class="tool" data-tool="draw" aria-pressed="false" title="Draw (D)" disabled>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21l3.500-1L18 8.500 15.500 6 4 17.500zM14 7.500l2.500 2.500"/></svg>
    </button>
    <button class="tool" data-tool="rect" aria-pressed="false" title="Rectangle (R)" disabled>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1.500"/></svg>
    </button>
    <span class="rail-sep"></span>
    <button class="tool" data-tool="cover" aria-pressed="false" title="Cover with white (hides, does not remove)" disabled>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="10" rx="1.500" class="fillish"/></svg>
    </button>
    <button class="tool" data-tool="redact" aria-pressed="false" title="Redact: permanently remove text" disabled>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="9" width="16" height="6" rx="1" class="solid"/><path d="M4 4h4M16 4h4M4 20h4M16 20h4"/></svg>
    </button>
    <span class="rail-grow"></span>
    <button id="undoBtn" class="tool plain" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    </button>
    <button id="redoBtn" class="tool plain" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></svg>
    </button>
  </nav>
  <aside id="pagesPanel" class="pages-panel" aria-label="Pages" hidden>
    <div class="pages-head">
      <h2>Pages</h2>
      <div class="page-tools">
        <button id="rotLeftBtn" class="icon-btn" title="Rotate selected pages left" aria-label="Rotate left" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.700M3 4v5h5"/></svg>
        </button>
        <button id="rotRightBtn" class="icon-btn" title="Rotate selected pages right" aria-label="Rotate right" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.700M21 4v5h-5"/></svg>
        </button>
        <button id="delPagesBtn" class="icon-btn" title="Delete selected pages" aria-label="Delete pages" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        </button>
        <button id="insertPagesBtn" class="icon-btn" title="Insert pages from another PDF" aria-label="Insert pages from another PDF" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M12 11v6M9 14h6"/></svg>
        </button>
        <button id="extractPagesBtn" class="icon-btn" title="Save selected pages as a new PDF" aria-label="Extract pages" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 15h6M12 12l3 3-3 3"/></svg>
        </button>
      </div>
    </div>
    <div id="thumbs" class="thumbs"></div>
    <input type="file" id="insertInput" accept="application/pdf,.pdf" hidden>
  </aside>
  <div id="stage">
    <div id="toolOptions" class="tool-options" hidden></div>
    <div id="viewerContainer">
      <div id="viewer" class="pdfViewer"></div>
      <div id="message" role="status"></div>
    </div>
  </div>

  <aside id="commentsPanel" class="panel" aria-label="Comments" hidden>
    <div class="panel-head">
      <h2>Comments</h2>
      <button id="closeComments" class="icon-btn" aria-label="Close comments">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="commentList" class="panel-body"></div>
  </aside>
</div>

<div id="dropHint" hidden>Drop a PDF to open it</div>
<div id="toast" role="status" hidden></div>
<div id="printRoot" aria-hidden="true"></div>
<dialog id="dialog">
  <form method="dialog" id="dialogForm">
    <h2 id="dialogTitle"></h2>
    <p id="dialogMessage" class="dialog-message" hidden></p>
    <label id="dialogLabel"><span id="dialogText"></span><input id="dialogInput" autocomplete="off"></label>
    <p id="dialogError" class="dialog-error" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="btn" id="dialogCancel">Cancel</button>
      <button type="submit" class="btn primary" id="dialogOk">OK</button>
    </div>
  </form>
</dialog>
<script type="module" src="main.js"></script>
</body>
</html>
