<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF handler test</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; }
  pre { background: #f2f2f2; padding: 1rem; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>PDF handler test</h1>
<p id="status">Waiting for a file. Open a PDF with this app to test.</p>
<pre id="log"></pre>
<script>
  const log = (msg) => {
    document.getElementById('log').textContent += msg + '\n';
  };
  log('Launch API present: ' + ('launchQueue' in window));
  log('Standalone display mode: ' + matchMedia('(display-mode: standalone)').matches);
  if ('launchQueue' in window) {
    launchQueue.setConsumer(async (params) => {
      if (!params.files || params.files.length === 0) {
        log('Launched with no files.');
        return;
      }
      for (const handle of params.files) {
        const file = await handle.getFile();
        document.getElementById('status').textContent = 'Received a file.';
        log('Received: ' + file.name + ' (' + file.size + ' bytes, ' + file.type + ')');
      }
    });
  }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
